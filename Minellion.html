<style>
:root{--gold:#ffcc33;--lava:#ff5a1f;--gem:#4fe3c1;--ink:#0d0b10;--paper:#f4e9d0;--f:"Press Start 2P","Courier New",monospace;

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
@supports(height:100dvh){html{height:100dvh}}
body{margin:0;height:100%;display:flex;flex-direction:column;overflow:hidden;font-family:var(--f);font-size:11px;line-height:1.7;color:var(--paper);background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px dashed var(--gold);outline-offset:2px}
.top{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px}
h1{margin:0;font-size:clamp(14px,4vw,22px);color:var(--gold);text-shadow:3px 3px 0 #000;letter-spacing:2px}
.hud{display:flex;gap:8px;align-items:center}
.tag{background:#000;border:3px solid var(--paper);padding:4px 8px;color:var(--gold);font-size:10px}
.b{font-size:10px;background:var(--lava);color:#fff;border:4px solid #000;padding:10px 12px;box-shadow:inset -4px -4px 0 #b93a0e,inset 4px 4px 0 #ff9a6b,4px 4px 0 #000}
.b.g{background:var(--gold);color:#1a1420;box-shadow:inset -4px -4px 0 #b88f10,inset 4px 4px 0 #ffe88a,4px 4px 0 #000}
.b.sm{padding:5px 8px;border-width:3px;box-shadow:3px 3px 0 #000}
.b:active:not(:disabled){transform:translate(3px,3px)}
.b:disabled{background:#555;color:#999;box-shadow:4px 4px 0 #000;cursor:default;text-decoration:line-through}
.scene{flex:1;min-height:0;position:relative;border-top:4px solid var(--paper);border-bottom:4px solid var(--paper);background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.panel{flex:none;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;background:var(--ink)}
.tline{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--gem)}
.tbar{flex:1;height:14px;border:3px solid var(--paper);background:#000}
.tbar i{display:block;height:100%;width:100%;background:var(--gem)}
.tbar i.low{background:var(--lava);animation:bl .5s steps(2) infinite}
@keyframes bl{50%{opacity:.4}}
.q{margin:0;font-weight:400;font-size:clamp(11px,2.4vw,15px);line-height:1.7;min-height:3.4em}
.q::after{content:"";display:inline-block;width:.6em;height:1em;background:var(--gold);margin-left:4px;vertical-align:-2px;animation:bl 1s steps(2) infinite}
.q.done::after{display:none}
.dig{display:flex;gap:10px;flex-wrap:wrap}
#ans{flex:1 1 180px;min-width:0;font:inherit;font-size:13px;color:var(--gold);background:#000;border:4px solid var(--paper);padding:10px;box-shadow:inset 4px 4px 0 #2a2433;caret-color:var(--gold)}
#ans::placeholder{color:#6d6478}
#ans:disabled{opacity:.6}
.msg{min-height:3.4em;font-size:10px;color:var(--gold)}
.end{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,440px);background:var(--ink);border:4px solid var(--paper);box-shadow:6px 6px 0 #000;padding:20px;text-align:center}
.end h2{margin:0 0 14px;font-size:clamp(14px,3.5vw,20px);line-height:1.5;color:var(--gold);font-weight:400}
.end p{margin:0 0 12px;line-height:1.9}
.pop{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;font-size:clamp(26px,9vw,76px);line-height:1.1;text-align:center;white-space:nowrap;letter-spacing:3px;text-shadow:5px 5px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}15%{transform:translate(-50%,-50%) scale(1.25);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.05);opacity:0}}
.end{z-index:4}
.hide{display:none!important}
@media(max-width:520px){.panel{padding:8px 10px 10px}.b{padding:9px 8px}}
</style>
</head>

function lockBox(h,lines){
 const e=$("end"),day=today();e.classList.remove("hide");
 e.innerHTML=`<h2>${h}</h2>${lines.map(l=>`<p>${l}</p>`).join("")}<p>THAT’S TODAY’S DIG DONE. COME BACK TOMORROW!</p><p id="cd" style="color:var(--gem)"></p>`;
 clearInterval(cdT);
 const tick=()=>{
  if(today()!==day){clearInterval(cdT);e.innerHTML=`<h2>NEW DAY!</h2><p>A FRESH MINE AWAITS.</p><button class="b g" id="again">PLAY TODAY’S DIG</button>`;$("again").onclick=start;return}
  const n=new Date(),ms=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n,t=Math.floor(ms/1000);
  const c=$("cd");if(c)c.textContent="NEXT DIG IN "+pad(Math.floor(t/3600))+":"+pad(Math.floor(t%3600/60))+":"+pad(t%60);
 };
 tick();cdT=setInterval(tick,1000);
}
const tiers=()=>TN.map((n,i)=>`${n} ${cnt[i]}`).join(" · ");
function finish(h,lines){fin=true;running=false;save({done:true,res:{h,lines}})}
function roundEnd(){
 running=false;lockUI(true);save();
 endBox(`ROUND ${round} COMPLETE`,[`BLOCKS DUG THIS ROUND: ${rdug}`,TN.map((n,i)=>`${n} ${rcnt[i]}`).join(" · "),`TOTAL DEPTH: ${depth} BLOCKS`],"NEXT ROUND",nextRound);
}
function nextRound(){round++;rq=0;rdug=0;rcnt=[0,0,0,0];used=false;$("end").classList.add("hide");showQ()}
function win(){
 if(fin)return;mrT=GOAL;coins();beep([392,.1,523,.1,659,.1,1047,.3]);
 $("msg").textContent="GOLD! A HUGE PILE OF IT.";
 const u=qn+1,rk=u<=30?"LEGEND":u<=42?"MASTER MINER":u<=55?"SEASONED MINER":u<=75?"APPRENTICE":"GREENHORN";
 const h="YOU REACHED THE GOLD!",lines=[`${GOAL} BLOCKS IN ${u} QUESTIONS (${round} ROUND${round>1?"S":""})`,tiers(),`RANK: ${rk}`];
 finish(h,lines);setTimeout(()=>lockBox(h,lines),1800);
}
$("quit").onclick=()=>{
 if(fin||digging)return;
 if(!qs){qs=1;$("quit").textContent="SURE?";setTimeout(()=>{qs=0;$("quit").textContent="QUIT"},3000);return}
 clearInterval(tw);lockUI(true);
 const h="YOU SURFACED!",lines=[`DEPTH: ${depth} BLOCKS`,`QUESTIONS: ${qn}`,tiers()];
 finish(h,lines);lockBox(h,lines);
};
function boot(){
 const s=load();
 if(!s||s.d!==today())return start();
 order=mkOrder();
 depth=s.depth;qn=s.qn;round=s.round;rq=s.rq;rdug=s.rdug;rcnt=s.rcnt;cnt=s.cnt;dug=s.dug;pos=s.pos;used=s.used;fin=false;digging=false;parts=[];shake=0;
 mr=mrT=depth>=GOAL?GOAL:depth-1;size();
 if(s.done&&s.res){fin=true;return lockBox(s.res.h,s.res.lines)}
 if(depth>=GOAL)return win();
 hud();
 if(rq>=10)return roundEnd();
 qn++;pos++;rq++;
 if(rq>=10)return roundEnd();
 showQ();$("msg").textContent="WELCOME BACK. YOUR LAST QUESTION WAS SKIPPED.";
}
$("go").onclick=submit;
$("ans").onkeydown=e=>{if(e.key==="Enter")submit()};
$("l1").onclick=()=>{
 if(!running||used)return;used=true;$("l1").disabled=true;
 const h=shuf(list).slice(0,2).map(o=>{const n=o.n[0];return n[0]+n.slice(1).replace(/\S/g,"·")});
 $("msg").textContent="BOOM! RUBBLE CLEARS: "+h.join("  OR  ").toUpperCase();beep([110,.2,80,.25]);$("ans").focus();
};
$("snd").onclick=()=>{snd=!snd;$("snd").textContent=snd?"SND ON":"SND OFF";$("snd").setAttribute("aria-pressed",snd)};
addEventListener("resize",size);
boot();requestAnimationFrame(frame);
</script>
</body>
</html>
